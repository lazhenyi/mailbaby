name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (race)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go build
        run: go build ./...

      - name: go test with race detector
        run: go test -race -count=1 ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ matrix.go }}
          go-package: ./...
          # sarif format never fails the job, keeping findings visible while
          # GO-2026-5046/5047/5048 (hamba/avro, transitive via pulsar-client-go)
          # have no upstream fix yet. Revert to blocking once fixed.
          output-format: sarif
          output-file: govulncheck.sarif

      - uses: actions/upload-artifact@v4
        with:
          name: govulncheck-findings
          path: govulncheck.sarif
          if-no-files-found: ignore

  docker:
    name: docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f build/Dockerfile -t mailbaby:ci .