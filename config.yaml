app:
  name: "mailbaby"
  env: "development"
  debug: true
  shutdown_timeout: "10s"

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "10s"
  write_timeout: "10s"
  idle_timeout: "30s"

log:
  level: "info"
  format: "text"
  output: "stdout"
  show_caller: false
  show_stacktrace: "error"
  async: false

metrics:
  enabled: true
  provider: "prometheus"
  path: "/metrics"
  collect_runtime: true
  collect_queue_stats: true
  collect_smtp_stats: true

observability:
  tracing:
    enabled: false
    provider: "otlp"
    endpoint: "localhost:4317"
    sample_rate: 1.0
  health:
    enabled: true
    host: "0.0.0.0"
    port: 8080
    live_path: "/livez"
    ready_path: "/readyz"
  pprof:
    enabled: false
    host: "127.0.0.1"
    port: 6060
    path: "/debug/pprof"

smtp:
  default:
    host: "smtp.example.com"
    port: 587
    username: "noreply@example.com"
    password: "your_smtp_password"
    from: "noreply@example.com"
    from_name: "MailBaby Service"
    reply_to: "support@example.com"
    encryption: "Auto"
    auth_type: "Auto"
    connect_timeout: "10s"
    send_timeout: "30s"
    pool:
      max_idle_conns: 5
      max_open_conns: 20
      idle_timeout: "60s"
    rate_limit:
      emails_per_second: 50
      max_recipients_per_email: 50

queue:
  driver: "memory"
  concurrency: 10
  max_retries: 3
  retry_interval: "5s"
  prefetch_count: 10
  batch_size: 1
  memory:
    buffer_size: 1024
